name: Python CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Python, uv, ruff и ty ставятся из mise.toml
      - uses: jdx/mise-action@v5
      - name: Install dependencies
        run: make install
      - name: Run checks
        run: mise exec -- hk check --all
      # Порог покрытия задан в pyproject.toml ([tool.coverage.report] fail_under),
      # поэтому шаг падает при просадке покрытия, и бейджик CI отражает в том числе его
      - name: Run test coverage
        run: |
          make test-coverage
