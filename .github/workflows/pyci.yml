name: Python CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
        # make depends on uv
      - name: Install dependencies
        run: |
          pip install uv
          make install
      - name: Run linter and pytest
        run: |
          make check
      # Порог покрытия задан в pyproject.toml ([tool.coverage.report] fail_under),
      # поэтому шаг падает при просадке покрытия, и бейджик CI отражает в том числе его
      - name: Run test coverage
        run: |
          make test-coverage
