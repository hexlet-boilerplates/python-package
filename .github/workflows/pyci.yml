name: Python CI

on:
  - push
  - pull_request

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Python, uv и ruff ставятся из mise.toml
      - uses: jdx/mise-action@v5
      - name: Install dependencies
        run: make install
      - name: Run linter and pytest
        run: |
          make check
      # Порог покрытия задан в pyproject.toml ([tool.coverage.report] fail_under),
      # поэтому шаг падает при просадке покрытия, и бейджик CI отражает в том числе его
      - name: Run test coverage
        run: |
          make test-coverage
