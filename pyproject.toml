[project]
authors = [
    {name = "Hexlet team", email = "team@hexlet.io"},
]
requires-python = "<4.0,>=3.12"
name = "hexlet-python-package"
version = "0.1.0"
description = "Example application"
readme = "README.md"

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

[project.scripts]
hexlet-python-package = "hexlet_python_package.scripts.main:main"

[tool.coverage.report]
# Порог покрытия: ниже него `make test-coverage` падает,
# и сборка в CI краснеет вместе с ним
fail_under = 80

[build-system]
requires = ["uv_build>=0.13.8,<0.14"]
build-backend = "uv_build"
