[tools]
python = "latest"
uv = "latest"
ruff = "latest"
ty = "latest"
# hk запускает проверки в git-хуках и в CI (hk.pkl), pkl нужен ему для чтения конфига.
hk = "latest"
pkl = "latest"

# Проверки документации и workflow, jactionlint вызывает shellcheck для блоков run
rumdl = "latest"
typos = "latest"
jactionlint = "latest"
shellcheck = "latest"

[env]
# uv берёт Python из mise, а не скачивает свой
UV_PYTHON_PREFERENCE = "only-system"
